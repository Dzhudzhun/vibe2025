<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        #auth-container {
            width: 300px;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        #todo-container {
            display: none;
            width: 70%;
            margin: 0 auto;
        }

        #todoList {
            border-collapse: collapse;
            width: 100%;
        }

            #todoList th, #todoList td {
                border: 1px solid #ddd;
                padding: 8px;
                text-align: left;
            }

            #todoList th {
                background-color: #f0f0f0;
            }

                #todoList th:first-child, #todoList th:last-child {
                    width: 5%;
                }

                #todoList th:nth-child(2) {
                    width: 90%;
                }

        .add-form {
            margin-top: 20px;
            width: 100%;
        }

            .add-form input[type="text"] {
                padding: 8px;
                width: 70%;
            }

            .add-form button {
                padding: 8px;
                width: 20%;
            }

        .error {
            color: red;
            text-align: center;
            margin: 10px 0;
        }

        button {
            cursor: pointer;
        }

        .edit-form {
            display: none;
            margin-top: 5px;
        }

            .edit-form input {
                width: 70%;
                padding: 5px;
            }

            .edit-form button {
                padding: 5px 10px;
                margin-right: 5px;
            }

        .edit-btn {
            margin-right: 5px;
        }

        .auth-form {
            margin-bottom: 15px;
        }

            .auth-form input {
                width: 100%;
                padding: 8px;
                margin: 5px 0;
                box-sizing: border-box;
            }

            .auth-form button {
                width: 100%;
                padding: 10px;
                margin: 5px 0;
            }

        .auth-toggle {
            text-align: center;
            margin-top: 10px;
            color: blue;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div id="auth-container">
        <h2 style="text-align: center;">Login</h2>
        <div id="auth-error" class="error"></div>

        <div class="auth-form">
            <input type="text" id="login-username" placeholder="Username">
            <input type="password" id="login-password" placeholder="Password">
            <button onclick="login()">Login</button>
        </div>

        <div class="auth-toggle" onclick="showRegister()">Don't have an account? Register</div>
    </div>

    <div id="todo-container">
        <h2 style="text-align: center;">To-Do List</h2>
        <div id="error" class="error"></div>
        <button onclick="logout()" style="float: right; margin: 10px;">Logout</button>

        <table id="todoList">
            <thead>
                <tr>
                    <th>Number</th>
                    <th>Text</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="listBody">
            </tbody>
        </table>

        <div class="add-form">
            <input type="text" id="newItem" placeholder="Enter new item">
            <button onclick="addItem()">Add</button>
        </div>
    </div>

    <script>
        let token = null;
        let userId = null;

        // Show register form
        function showRegister() {
            document.querySelector('#auth-container h2').textContent = 'Register';
            document.querySelector('.auth-form button').textContent = 'Register';
            document.querySelector('.auth-form button').onclick = register;
            document.querySelector('.auth-toggle').textContent = 'Already have an account? Login';
            document.querySelector('.auth-toggle').onclick = showLogin;
            document.getElementById('auth-error').textContent = '';
        }

        // Show login form
        function showLogin() {
            document.querySelector('#auth-container h2').textContent = 'Login';
            document.querySelector('.auth-form button').textContent = 'Login';
            document.querySelector('.auth-form button').onclick = login;
            document.querySelector('.auth-toggle').textContent = 'Don\'t have an account? Register';
            document.querySelector('.auth-toggle').onclick = showRegister;
            document.getElementById('auth-error').textContent = '';
        }

        // Login function
        async function login() {
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value.trim();
            const errorElement = document.getElementById('auth-error');

            if (!username || !password) {
                errorElement.textContent = 'Username and password are required';
                return;
            }

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Login failed');
                }

                const data = await response.json();
                token = data.token;
                userId = data.userId;

                // Hide auth container, show todo container
                document.getElementById('auth-container').style.display = 'none';
                document.getElementById('todo-container').style.display = 'block';

                // Load the todo items
                loadTodoItems();
            } catch (error) {
                console.error('Error:', error);
                errorElement.textContent = error.message;
            }
        }

        // Register function
        async function register() {
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value.trim();
            const errorElement = document.getElementById('auth-error');

            if (!username || !password) {
                errorElement.textContent = 'Username and password are required';
                return;
            }

            try {
                const response = await fetch('/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Registration failed');
                }

                // After successful registration, switch to login form
                showLogin();
                errorElement.textContent = 'Registration successful. Please login.';
                errorElement.style.color = 'green';
            } catch (error) {
                console.error('Error:', error);
                errorElement.textContent = error.message;
                errorElement.style.color = 'red';
            }
        }

        // Logout function
        function logout() {
            token = null;
            userId = null;
            document.getElementById('auth-container').style.display = 'block';
            document.getElementById('todo-container').style.display = 'none';
            document.getElementById('login-username').value = '';
            document.getElementById('login-password').value = '';
            document.getElementById('auth-error').textContent = '';
        }

        // Load todo items
        async function loadTodoItems() {
            try {
                const response = await fetch('/api/items', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Failed to load items');
                }

                const data = await response.json();
                document.getElementById('listBody').innerHTML = data.html;
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('error').textContent = error.message;
            }
        }

        // Add item
        async function addItem() {
            const newItemInput = document.getElementById('newItem');
            const newItemText = newItemInput.value.trim();
            const errorElement = document.getElementById('error');
            errorElement.textContent = '';

            if (!newItemText) {
                errorElement.textContent = 'Please enter a task';
                return;
            }

            try {
                const response = await fetch('/api/items', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ text: newItemText })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Failed to add item');
                }

                loadTodoItems();
                newItemInput.value = '';
            } catch (error) {
                console.error('Error:', error);
                errorElement.textContent = error.message;
            }
        }

        // Remove item
        async function removeItem(id) {
            if (!confirm('Are you sure you want to delete this item?')) {
                return;
            }

            try {
                const response = await fetch(`/api/items/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Failed to remove item');
                }

                loadTodoItems();
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('error').textContent = error.message;
            }
        }

        function enableEdit(id) {
            const row = document.querySelector(`tr[data-id="${id}"]`);
            if (!row) return;

            // Hide the normal text display
            row.querySelector('.item-text').style.display = 'none';

            // Show the edit form
            const editForm = row.querySelector('.edit-form');
            editForm.style.display = 'block';
            editForm.querySelector('input').focus();
        }

        async function saveEdit(id) {
            const row = document.querySelector(`tr[data-id="${id}"]`);
            if (!row) return;

            const editInput = row.querySelector('.edit-form input');
            const newText = editInput.value.trim();
            const errorElement = document.getElementById('error');
            errorElement.textContent = '';

            if (!newText) {
                errorElement.textContent = 'Text cannot be empty';
                return;
            }

            try {
                const response = await fetch(`/api/items/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ text: newText })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Failed to update item');
                }

                loadTodoItems();
            } catch (error) {
                console.error('Error:', error);
                errorElement.textContent = error.message;
            }
        }

        function cancelEdit(id) {
            const row = document.querySelector(`tr[data-id="${id}"]`);
            if (!row) return;

            // Show the normal text display
            row.querySelector('.item-text').style.display = '';

            // Hide the edit form
            row.querySelector('.edit-form').style.display = 'none';
        }

        document.getElementById('newItem').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                addItem();
            }
        });
    </script>
</body>
</html>
